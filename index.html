<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bizim Masalar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: iddialı, editoryal; bir tasarım stüdyosunun vitrin sayfası gibi, içi bizim anılarımız.
   IDEA: kaide üstünde sergilenen mimari maket; mekânın adı dev harflerle maketin arkasından ve önünden geçer.
   PICTURE: tam ekran 3D maket koyu kaidede, doygun tek renk alanı; dev harfler arkada dolu, önde kontur.
   COLOUR and TYPE: her mekânın kendi rengi (Esentepe: terakota alan, şeftali harf). Archivo geniş 800 dev başlık,
     Instrument Serif italik slogan, Inter küçük etiketler.
   LAYOUT: sol üstte dev isim, sağda italik slogan, köşelerde minik etiketler, altta 01/01 · noktalar · Keşfet. */
:root{color-scheme:dark;--f1:#c45a2e;--f2:#5e2210;--type:#f9cfb2;--ink:#fff4ec;
  --soft:color-mix(in srgb,var(--ink) 62%,transparent);--line:color-mix(in srgb,var(--ink) 22%,transparent);
  --glass:color-mix(in srgb,var(--f2) 76%,transparent);--chip:color-mix(in srgb,var(--ink) 12%,transparent)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden;background:var(--f2)}
.field{position:fixed;inset:0;z-index:-1;background:radial-gradient(110% 85% at 62% 58%,var(--f1) 0%,var(--f2) 78%)}
.field::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.35))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--type);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:1}
.hero{position:fixed;left:clamp(16px,3.6vw,64px);top:clamp(64px,10vh,120px);z-index:0;pointer-events:none;
  font:800 clamp(72px,11.6vw,250px)/.8 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.045em;color:var(--type);text-transform:uppercase}
.hero.front{z-index:2;color:transparent;-webkit-text-stroke:1.2px color-mix(in srgb,var(--type) 75%,transparent)}
.hero .ln{display:block;white-space:nowrap}
.hero .ln+.ln{padding-left:.9em}
.hero .it{font:italic 400 .36em/1 "Instrument Serif",serif;text-transform:none;letter-spacing:0;padding-left:2.6em;margin-top:.12em}
.hero .ch{display:inline-block;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .7s}
.hero.out .ch{transform:translateY(55%);opacity:0;transition-delay:0s!important;transition-duration:.35s}
.slogan{position:fixed;right:clamp(16px,6vw,110px);top:44%;z-index:2;pointer-events:none;text-align:right;white-space:pre-line;
  font:italic 400 clamp(26px,2.7vw,44px)/1 "Instrument Serif",serif;color:var(--type);transition:opacity .6s}
.out2{opacity:0}
.lab{position:fixed;z-index:3;font-size:11px;line-height:1.35;color:var(--soft);pointer-events:none}
.lab b{display:block;color:var(--ink);font-weight:500}
.brand{left:clamp(16px,3.6vw,64px);top:20px}
.meta{left:clamp(16px,3.6vw,64px);bottom:26px}
.hint{right:clamp(16px,3vw,48px);bottom:26px;text-align:right;transition:opacity .6s}
.icons{position:fixed;right:18px;top:16px;display:flex;gap:8px;z-index:3}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--f2) 40%,transparent);backdrop-filter:blur(10px);display:grid;place-items:center;padding:0}
.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic[aria-pressed=true]{background:var(--ink);color:var(--f2);border-color:var(--ink)}
.ic[hidden]{display:none}
.acct img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);margin-top:6px}
.by img,.av{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--chip)}
.gbtn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:var(--f2);font-weight:500;margin:4px 0 18px}
.me{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.me img{width:56px;height:56px;border-radius:50%}
.ph img:not([src]){background:var(--chip)}
.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:14px;font-size:11px;color:var(--soft);white-space:nowrap}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:9px;height:9px;border-radius:999px;border:1px solid var(--ink);background:transparent;padding:0;transition:width .4s}
.dots button[aria-current=true]{width:26px;background:var(--ink)}
.arw{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.arw:disabled{opacity:.3;cursor:default}
.arw svg,.explore svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.explore{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:none;font-size:12px;font-weight:500;color:var(--ink)}
.explore:hover{background:var(--ink);color:var(--f2)}
.tip{position:fixed;pointer-events:none;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--f2);font-size:13px;white-space:nowrap;transform:translate(-50%,-150%);display:none;z-index:4}
.load{position:fixed;left:50%;top:55%;transform:translate(-50%,-50%);font:italic 22px "Instrument Serif",serif;color:var(--type);z-index:2;pointer-events:none;transition:opacity .4s}
.load.off{opacity:0}
.sheet{position:fixed;z-index:5;background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);overflow:auto;overscroll-behavior:contain;
  right:16px;top:76px;bottom:76px;width:min(400px,calc(100vw - 32px));border-radius:22px;padding:22px;
  transform:translateX(calc(100% + 32px));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet h2{margin:0;font:800 34px/.95 Archivo,sans-serif;font-stretch:115%;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.where{font:italic 19px "Instrument Serif",serif;color:var(--type);margin:8px 0 18px}
.x{position:sticky;top:0;float:right;margin:-8px -8px 0 8px}
.memo{margin:0 0 22px}
.ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;border-radius:14px;overflow:hidden;margin-bottom:8px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.ph img:only-child{grid-column:span 2;aspect-ratio:4/3}
.d{font:italic 21px/1 "Instrument Serif",serif}
.who{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px}
.memo p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.lnk{background:none;border:0;padding:0;color:var(--soft);font-size:12px;min-height:28px}
.empty{color:var(--soft);font:italic 21px "Instrument Serif",serif;margin:4px 0 18px}
.plus{width:56px;height:56px;border-radius:50%;border:0;background:var(--type);color:var(--f2);display:grid;place-items:center;margin:4px 0 18px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.plus svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
form{display:grid;gap:10px;margin:0 0 20px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{position:relative;display:flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--chip);cursor:pointer;font-size:14px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){background:var(--ink);color:var(--f2)}
.pick label:has(input:focus-visible){outline:2px solid var(--type)}
.lbl{font-size:11px;color:var(--soft)}
input[type=date],textarea{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
textarea::placeholder{color:var(--soft)}
textarea{min-height:84px;resize:vertical}
.file{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;border:1px dashed var(--line);border-radius:12px;padding:0 12px;cursor:pointer;font-size:14px;color:var(--soft)}
.file input{position:absolute;opacity:0;width:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.go{min-height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:var(--f2);font-weight:500}
.st{font-size:12px;color:var(--soft)}
details.cm{border-top:1px solid var(--line);padding-top:12px}
details.cm summary{cursor:pointer;font:italic 21px "Instrument Serif",serif;min-height:40px;display:flex;align-items:center;list-style:none}
details.cm summary::-webkit-details-marker{display:none}
.c{padding:8px 0;font-size:14px}
.c b{font-weight:500}
.c span{color:var(--soft);font-size:12px;margin-left:6px}
.c p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--soft);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:14px}
.grid button{min-height:44px;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.grid button:hover{background:var(--chip)}
.grid i{font-style:normal;color:var(--type)}
.gh{font:italic 19px "Instrument Serif",serif;color:var(--type);margin:14px 0 6px}
.pk{position:fixed;inset:0;z-index:8;background:color-mix(in srgb,var(--f2) 94%,transparent);backdrop-filter:blur(22px);display:flex;flex-direction:column;justify-content:center;
  padding:clamp(24px,7vw,96px);opacity:0;pointer-events:none;transition:opacity .35s}
.pk.on{opacity:1;pointer-events:auto}
.pk .k{font:italic 24px "Instrument Serif",serif;color:var(--type);margin-bottom:18px}
.pk ol{list-style:none;margin:0;padding:0}
.pk li button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,3vw,40px);align-items:center;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--line);padding:clamp(14px,2.4vw,28px) 0;transform:translateY(14px);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.pk.on li button{transform:none;opacity:1}
.pk li:nth-child(2) button{transition-delay:.06s}.pk li:nth-child(3) button{transition-delay:.12s}.pk li:nth-child(4) button{transition-delay:.18s}
.pk .n{font-size:12px;color:var(--soft);width:2.4em}
.pk .t{font:800 clamp(38px,7vw,110px)/.85 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.04em;text-transform:uppercase}
.pk .t small{display:block;font:italic 400 21px "Instrument Serif",serif;letter-spacing:0;text-transform:none;color:var(--type);margin-top:10px}
.pk .im{width:clamp(90px,16vw,220px);aspect-ratio:5/4;object-fit:contain;filter:drop-shadow(0 14px 20px rgba(0,0,0,.35));transition:transform .5s}
.pk li button:hover .im{transform:translateY(-6px) rotate(-1.5deg)}
.pk li button[aria-current=true] .t{color:var(--type)}
.pk .soon{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--soft)}
.pk .ic{position:absolute;right:18px;top:16px}
.lb{position:fixed;inset:0;background:rgba(10,6,4,.92);display:none;place-items:center;z-index:9;padding:16px}
.lb img{max-width:100%;max-height:92vh;border-radius:12px}
@media(max-width:700px){
  .hero{font-size:clamp(40px,13vw,110px);top:76px}
  .slogan,.hint,.meta{display:none}
  .nav{bottom:max(14px,env(safe-area-inset-bottom));gap:10px}
  .sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-height:74dvh;border-radius:22px 22px 0 0;transform:translateY(105%);padding-bottom:max(22px,env(safe-area-inset-bottom))}
  .pk .im{display:none}.pk li button{grid-template-columns:auto minmax(0,1fr)}
}
@media(prefers-reduced-motion:reduce){.sheet,.pk,.pk li button,.hero .ch,.slogan{transition:none}}
</style>

<script type="module">

   renk:{f1:"#c45a2e",f2:"#5e2210",type:"#f9cfb2",ink:"#fff4ec"},kaide:0x4a1a0c,

   openAbove:[1,2,3,4,16,17,18,19,23,24],
   masalar:[

let V=VMAP[location.hash.slice(1)]||VENUES[0];

let anilar=[],yorumlar=[],kisiler={},sel=null,view=null,db=null,auth=null,me=null,loaded=false,offline="",adding=false;
const fotoCache=new Map();
const inV=a=>a.mekan===V.id;

// ================================================================ 3D
const canvas=$("c"),tip=$("tip");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});

{const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.35}

const sun=new THREE.DirectionalLight(0xfff0dc,2.6);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.02;

const controls=new OrbitControls(cam,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.45;controls.minZoom=.5;controls.maxZoom=7;controls.screenSpacePanning=true;

const WIDE_DIR=new THREE.Vector3(-.54,.64,.54).normalize(),TALL_DIR=new THREE.Vector3(-.2,.74,.64).normalize();
let HOME_DIR=portrait()?TALL_DIR:WIDE_DIR;
const cache={};           // mekân id -> {root, ust, masaObj, home}
let M=null,pins={},hover=null,anim=null,moves=[];   // M: şu anki maket

function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  const a=w/h,half=a<.8?Math.max(30,17/a):Math.max(21,30/a);const nd=a<.8?TALL_DIR:WIDE_DIR;if(nd!==HOME_DIR){HOME_DIR=nd;if(M&&!sel&&!anim)place(M.home,1,HOME_DIR)}cam.left=-half*a;cam.right=half*a;cam.top=half;cam.bottom=-half;
  if(a>1.15&&w>900)cam.setViewOffset(w,h,-w*.09,-h*.04,w,h);else if(a<.8)cam.setViewOffset(w,h,0,-h*.1,w,h);else cam.clearViewOffset();cam.updateProjectionMatrix()}
addEventListener("resize",size);size();

function fetchModel(v){
  return new Promise((ok,err)=>new GLTFLoader().load(`assets/models/${v.id}.glb`,ok,undefined,err));
}
function prepare(v,g){
  const root=g.scene,masaObj={};let ust=null;
  root.traverse(o=>{
    if(o.isMesh){o.castShadow=o.receiveShadow=true;const m=o.material;if(m&&m.transparent&&m.opacity<.5){o.castShadow=false;o.userData.glass=true}}
    if(o.name==="UstKat")ust=o;
    const id=o.userData?.masa_id;
    if(id&&v.T[id]){masaObj[id]=o;o.traverse(c=>{if(c.isMesh){c.material=c.material.clone();c.userData.e0=c.material.emissive?.getHex();c.userData.i0=c.material.emissiveIntensity}})}
  });
  const box=new THREE.Box3().setFromObject(root),c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()),r=sz.length()/2;
  const pl=new THREE.Mesh(new THREE.BoxGeometry(sz.x+3,4,sz.z+3),new THREE.MeshStandardMaterial({color:v.kaide??0x333333,roughness:.9}));
  pl.position.set(c.x,box.min.y-2,c.z);pl.receiveShadow=true;root.add(pl);
  return {v,root,ust,masaObj,home:new THREE.Vector3(c.x,1.5,c.z),c,r};
}
function light(m){
  sun.position.set(m.c.x-28,m.c.y+48,m.c.z+30);sun.target.position.copy(m.c);fill.position.set(m.c.x+30,m.c.y+20,m.c.z-30);
  Object.assign(sun.shadow.camera,{left:-m.r,right:m.r,top:m.r,bottom:-m.r,near:1,far:220});sun.shadow.camera.updateProjectionMatrix();
}
function chars(v){
  const ln=(t,li,cls="")=>`<span class="ln ${cls}">${[...t].map((c,i)=>`<span class="ch" style="transition-delay:${(li*7+i)*38}ms">${c===" "?"&nbsp;":esc(c)}</span>`).join("")}</span>`;
  return v.baslik.map((t,i)=>ln(t,i)).join("")+(v.alt?ln(v.alt,v.baslik.length,"it"):"");
}
function look(v,first){
  const st=document.documentElement.style;for(const [k,x] of Object.entries(v.renk||{}))st.setProperty("--"+k,x);
  $("vname").textContent=v.ad;document.title="Bizim Masalar · "+v.ad;
  const i=VENUES.indexOf(v),n=VENUES.length,p=x=>String(x).padStart(2,"0");$("idx").textContent=`${p(i+1)} / ${p(n)}`;
  $("prev").disabled=n<2;$("next").disabled=n<2;
  $("dots").innerHTML=VENUES.map(x=>`<button aria-label="${esc(x.ad)}" aria-current="${x===v}" data-dot="${x.id}"></button>`).join("");
  $("dots").querySelectorAll("[data-dot]").forEach(b=>b.onclick=()=>switchVenue(b.dataset.dot));
  const hs=[$("h1"),$("h2")],sl=$("slogan");hs.forEach(h=>h.classList.add("out"));sl.classList.add("out2");
  setTimeout(()=>{hs.forEach(h=>h.innerHTML=chars(v));sl.textContent=v.slogan||"";
    setTimeout(()=>{hs.forEach(h=>h.classList.remove("out"));sl.classList.remove("out2")},40)},first?300:420);
}
$("prev").onclick=()=>{const i=VENUES.indexOf(V);switchVenue(VENUES[(i-1+VENUES.length)%VENUES.length].id)};
$("next").onclick=()=>{const i=VENUES.indexOf(V);switchVenue(VENUES[(i+1)%VENUES.length].id)};
const ease=k=>1-(1-k)**3;
async function showVenue(v,first=false){
  close(true);
  const load=$("load");load.textContent="maket kuruluyor";load.classList.remove("off");
  look(v,first);
  $("ust").hidden=!v.ustKat;
  const old=M;
  if(old&&!reduce)moves.push({obj:old.root,from:0,to:-14,t0:performance.now(),dur:700,done:()=>scene.remove(old.root)});
  else if(old)scene.remove(old.root);
  let m=cache[v.id];
  if(!m){try{m=cache[v.id]=prepare(v,await fetchModel(v))}catch(e){load.textContent="maket yüklenemedi; sayfayı yenile";return}}
  if(V!==v)return; // bu sırada başka mekâna geçildi
  M=m;light(m);if(m.ust)m.ust.visible=true;$("ust").setAttribute("aria-pressed",true);
  m.root.position.y=0;scene.add(m.root);load.classList.add("off");
  if(reduce){place(m.home,1,HOME_DIR)}
  else{
    m.root.position.y=16;moves.push({obj:m.root,from:16,to:0,t0:performance.now()+(old?250:0),dur:1100});
    const startDir=first?new THREE.Vector3(-.2,.95,.25).normalize():cam.position.clone().sub(controls.target).normalize();
    anim={t0:performance.now(),dur:first?2200:1300,fromT:old?controls.target.clone():m.home.clone(),toT:m.home.clone(),fromZ:first?.55:cam.zoom,toZ:1,fromD:startDir,toD:HOME_DIR.clone()};
  }
  refreshPins();
}
function switchVenue(id){const v=VMAP[id];if(!v||v===V)return;V=v;try{history.replaceState(null,"","#"+v.id)}catch(e){location.hash=v.id}showVenue(v)}
addEventListener("hashchange",()=>switchVenue(location.hash.slice(1)));

function place(t,z,d){controls.target.copy(t);cam.position.copy(t).addScaledVector(d,80);cam.zoom=z;cam.updateProjectionMatrix()}
function fly(target,zoom,dir){
  const cur=cam.position.clone().sub(controls.target).normalize();
  if(reduce)return place(target,zoom,dir||cur);
  anim={t0:performance.now(),dur:800,fromT:controls.target.clone(),toT:target.clone(),fromZ:cam.zoom,toZ:zoom,fromD:cur,toD:(dir||cur).clone()};
}
function setUst(on){if(M?.ust)M.ust.visible=on;$("ust").setAttribute("aria-pressed",on)}
$("ust").onclick=()=>setUst(!(M?.ust?M.ust.visible:true));
$("reset").onclick=()=>{close();setUst(true);if(M)fly(M.home,1,HOME_DIR)};
$("all").onclick=()=>{if(view==="all")return close();if(sel)tint(sel,false);sel=null;view="all";open()};

    return `<li><button data-v="${v.id}" aria-current="${v===V}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${esc(v.ad)}<small>${n?`${n} anı`:"henüz anı yok"}</small></span>${v.thumb?`<img class="im" src="${esc(v.thumb)}" alt="">`:""}</button></li>`}).join("");
}

function pinMesh(color,last){
  const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.5,roughness:.35});
  const b=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),mat);b.position.y=.85;
  const t=new THREE.Mesh(new THREE.ConeGeometry(.22,.62,18),mat);t.rotation.x=Math.PI;t.position.y=.32;
  g.add(b,t);
  if(last){const ring=new THREE.Mesh(new THREE.TorusGeometry(.7,.07,10,40),new THREE.MeshStandardMaterial({color:0x3f8f6b,emissive:0x3f8f6b,emissiveIntensity:.8}));ring.rotation.x=Math.PI/2;ring.position.y=.85;g.add(ring)}
  g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.userData.pin=true}});
  return g;
}
function refreshPins(){
  for(const id in pins)pins[id].parent?.remove(pins[id]);pins={};
  const mine=anilar.filter(inV),n=mine.length,m=new Set(mine.map(a=>a.masa)).size;
  $("count").innerHTML=`<b>${V.order.length} masa</b>${n?`${n} anı · ${m} masada`:me?"henüz anı yok":"giriş yapınca anılar görünür"}`;
  if(!M)return;
  const last=lastMasa(),y0=M.root.position.y;M.root.position.y=0;M.root.updateMatrixWorld(true);
  for(const id of V.order){
    const o=M.masaObj[id];if(!o)continue;const k=byMasa(anilar,id).length;if(!k&&id!==sel)continue;
    const b=new THREE.Box3().setFromObject(o);
    const p=pinMesh(k?heatColor(k):0x9a8f84,id===last);
    p.position.copy(o.worldToLocal(new THREE.Vector3((b.min.x+b.max.x)/2,b.max.y+.35,(b.min.z+b.max.z)/2)));
    p.quaternion.copy(o.getWorldQuaternion(new THREE.Quaternion()).invert());
    p.userData.base=p.position.y;o.add(p);pins[id]=p;
  }
  M.root.position.y=y0;
}
function tint(id,on,color){
  M?.masaObj[id]?.traverse(c=>{if(c.isMesh&&!c.userData.pin&&c.material?.emissive&&c.userData.e0!==undefined){c.material.emissive.setHex(on?color:c.userData.e0);c.material.emissiveIntensity=on?.5:c.userData.i0}});
}

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
const shown=o=>{for(let p=o;p;p=p.parent)if(!p.visible)return false;return true};
function pick(e){
  if(!M||moves.length)return null;
  ptr.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ptr,cam);
  for(const h of ray.intersectObject(M.root,true)){
    if(h.object.userData.glass||!shown(h.object))continue;
    for(let p=h.object;p;p=p.parent){const id=p.userData?.masa_id;if(id&&V.T[id])return id}
    return null;
  }
  return null;
}
let down=null;
canvas.addEventListener("pointerdown",e=>{$("hint").style.opacity=0;down={x:e.clientX,y:e.clientY};if(!moves.length)anim=null});
canvas.addEventListener("pointerup",e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y)>6;down=null;if(moved)return;const id=pick(e);if(id)select(id);else if(view)close()});
canvas.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||down)return;const id=pick(e);
  if(id!==hover){if(hover&&hover!==sel)tint(hover,false);hover=id;if(id&&id!==sel)tint(id,true,0x5a3418)}
  canvas.style.cursor=id?"pointer":"grab";
  if(id){tip.style.display="block";tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";const n=byMasa(anilar,id).length;tip.textContent=V.T[id].ad+(n?` · ${n}`:"")}else tip.style.display="none";
});
canvas.addEventListener("pointerleave",()=>{tip.style.display="none"});
addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("lb").style.display==="grid")$("lb").style.display="none";else if(pk.classList.contains("on"))closePicker();else close()});

function select(id){
  if(!M)return;if(sel)tint(sel,false);sel=id;view="masa";adding=false;tint(id,true,0x8a3212);tip.style.display="none";
  const t=V.T[id];if(V.ustKat){if(t.kat==="Üst kat")setUst(true);else if(!V.open.has(id))setUst(false)}
  fly(new THREE.Box3().setFromObject(M.masaObj[id]).getCenter(new THREE.Vector3()),2.6);
  refreshPins();open();
}
function close(silent){if(sel)tint(sel,false);sel=null;view=null;adding=false;$("sheet").classList.remove("on");if(!silent)refreshPins()}
function open(){render(false);$("sheet").classList.add("on");$("sheet").scrollTop=0}

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime(),now=performance.now();
  if(anim){const k=Math.min(1,(now-anim.t0)/anim.dur),e=ease(k);
    controls.target.lerpVectors(anim.fromT,anim.toT,e);
    cam.position.copy(controls.target).addScaledVector(anim.fromD.clone().lerp(anim.toD,e).normalize(),80);
    cam.zoom=anim.fromZ+(anim.toZ-anim.fromZ)*e;cam.updateProjectionMatrix();if(k>=1)anim=null}
  moves=moves.filter(m=>{const k=Math.max(0,Math.min(1,(now-m.t0)/m.dur));m.obj.position.y=m.from+(m.to-m.from)*ease(k);if(k>=1){m.done?.();return false}return true});
  if(!reduce)for(const id in pins){const p=pins[id];p.position.y=p.userData.base+Math.sin(t*1.8+ +id)*.14;p.rotation.y=t*.6}
  controls.update();renderer.render(scene,cam);
});

let busy=false,pending=false;
function grab(){const fa=sheet.querySelector("#fa"),fy=sheet.querySelector("#fy"),cm=sheet.querySelector("details.cm"),ae=document.activeElement;
  return {v:V.id,masa:sel,cm:cm?.open,fa:fa?{tarih:fa.tarih.value,metin:fa.metin.value,kimler:[...fa.querySelectorAll("[name=kimler]:checked")].map(i=>i.value)}:null,y:fy?.metin.value,f:ae?.name&&sheet.contains(ae)?ae.closest("form")?.id+"|"+ae.name:""}}

  const cn=sheet.querySelector("#cancel");if(cn)cn.onclick=()=>{adding=false;render(false)};
  const fa=sheet.querySelector("#fa");if(fa){fa.onsubmit=saveAni;
    const fi=fa.querySelector("[name=foto]");if(fi)fi.onchange=()=>{$("fn").textContent=fi.files.length?`${fi.files.length} fotoğraf seçildi`:"Fotoğraf ekle"}}
  const fy=sheet.querySelector("#fy");if(fy)fy.onsubmit=saveYorum;
}
$("lb").onclick=()=>{$("lb").style.display="none"};

async function del(col,id,btn){
  if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="emin misin?";return}
  btn.disabled=true;
  try{
    if(col==="anilar"){const a=anilar.find(x=>x._id===id);for(const f of a?.fotolar||[])await deleteDoc(doc(db,"fotolar",f)).catch(()=>{})}
    await deleteDoc(doc(db,col,id));
  }catch(e){btn.textContent="silinemedi"}
}
async function loadFoto(img){
  const id=img.dataset.foto;if(!id||!db||img.dataset.loading)return;img.dataset.loading="1";
  try{if(!fotoCache.has(id)){const d=await getDoc(doc(db,"fotolar",id));const v=d.data()?.data;if(typeof v==="string"&&v.startsWith("data:image/"))fotoCache.set(id,v)}
    const v=fotoCache.get(id);if(v)sheet.querySelectorAll(`img[data-foto="${CSS.escape(id)}"]`).forEach(i=>i.src=v)}catch(e){}
}
// Fotoğrafı Firestore belgesine sığacak bir JPEG data URL'ye çevirir (belge sınırı 1 MiB).
async function shrink(file){
  const bmp=await createImageBitmap(file);
  for(const [max,q] of [[1280,.82],[1280,.7],[1080,.68],[900,.62],[720,.6]]){
    const s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const u=c.toDataURL("image/jpeg",q);if(u.length<900000)return u;
  }
  throw new Error("büyük");
}
const writeErr=e=>e?.code==="permission-denied"?"İznin yok; giriş yaptın mı?":e?.code==="resource-exhausted"?"Günlük kota doldu, yarın tekrar dene.":e?.message==="büyük"?"Fotoğraf çok büyük.":"Kaydedilemedi, tekrar dene.";
async function saveAni(ev){
  ev.preventDefault();const f=ev.target,st=$("fs"),btn=f.querySelector("[type=submit]");
  if(!me){st.textContent="Önce giriş yap.";return}
  const kimler=[...f.querySelectorAll("[name=kimler]:checked")].map(i=>i.value),metin=f.metin.value.trim(),files=[...(f.foto?.files||[])];
  if(!metin&&!files.length){st.textContent="Bir şey yaz ya da fotoğraf ekle.";return}
  btn.disabled=true;busy=true;let ok=false;const fotolar=[],masa=sel,mekan=V.id;
  try{
    for(let i=0;i<files.length;i++){st.textContent=`fotoğraf ${i+1}/${files.length}`;
      const r=await addDoc(collection(db,"fotolar"),{data:await shrink(files[i]),yazarUid:me.uid,zaman:Date.now()});fotolar.push(r.id)}
    st.textContent="kaydediliyor";
    const k=kimler.length?kimler:[me.uid];
    await addDoc(collection(db,"anilar"),{mekan,masa,tarih:f.tarih.value||today(),kimler:k,kimlerAd:k.map(u=>kisiler[u]?.ad||""),metin,fotolar,
      yazarUid:me.uid,yazarAd:me.displayName||"",yazarFoto:me.photoURL||"",zaman:Date.now(),olusturma:serverTimestamp()});ok=true;
  }catch(e){st.textContent=writeErr(e);btn.disabled=false;for(const id of fotolar)deleteDoc(doc(db,"fotolar",id)).catch(()=>{})}
  busy=false;if(ok){adding=false;pending=false;render(false)}else if(pending){pending=false;render()}
}
async function saveYorum(ev){
  ev.preventDefault();const f=ev.target,st=$("ys"),metin=f.metin.value.trim();if(!metin||!me)return;
  f.querySelector("[type=submit]").disabled=true;busy=true;let ok=false;
  try{await addDoc(collection(db,"yorumlar"),{mekan:V.id,masa:sel,metin,yazarUid:me.uid,yazarAd:me.displayName||"",zaman:Date.now(),olusturma:serverTimestamp()});ok=true}
  catch(e){st.textContent=writeErr(e);f.querySelector("[type=submit]").disabled=false}
  busy=false;if(ok){const k=grab();k.y="";k.cm=true;render(false);put(k)}else if(pending){pending=false;render()}
}

// ================================================================ veri
const str=v=>typeof v==="string"?v:"",arr=v=>Array.isArray(v)?v.filter(k=>typeof k==="string"):[];
const clean=d=>{const x=d.data();if(!x)return null;const mekan=str(x.mekan)||"esentepe";
  if(!VMAP[mekan]||typeof x.masa!=="number"||!VMAP[mekan].T[x.masa])return null;
  return {_id:d.id,mekan,masa:x.masa,tarih:str(x.tarih),zaman:+x.zaman||0,metin:str(x.metin),yazarUid:str(x.yazarUid),yazarAd:str(x.yazarAd),yazarFoto:str(x.yazarFoto),
    kimler:arr(x.kimler),kimlerAd:arr(x.kimlerAd),fotolar:arr(x.fotolar)}};
showVenue(V,true);

const provider=new GoogleAuthProvider();
function login(){
  if(!auth)return;
  signInWithPopup(auth,provider).catch(e=>{
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e?.code))signInWithRedirect(auth,provider);
    else if(e?.code!=="auth/popup-closed-by-user"){offline="Giriş yapılamadı: "+(e?.code||"bilinmeyen hata");render()}
  });
}
function updateAcct(){
  const b=$("acct");
  b.innerHTML=me?.photoURL?`<img src="${esc(me.photoURL)}" alt="" referrerpolicy="no-referrer">`:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
  b.setAttribute("aria-label",me?`Hesap: ${me.displayName||""}`:"Google ile giriş");
}
$("acct").onclick=()=>{if(sel)tint(sel,false);sel=null;view="hesap";open()};

let subs=[];
function subscribe(){
  const timer=setTimeout(()=>{offline="Anılara şu an ulaşılamıyor.";render()},10000);
  let got=0;const done=s=>{loaded=true;if(!s.metadata.fromCache&&++got>=2){clearTimeout(timer);if(offline.startsWith("Anılara"))offline=""}};
  const fail=e=>{clearTimeout(timer);offline=e?.code==="permission-denied"?"Bu hesabın görme izni yok.":"Kayıtlar yüklenemedi.";loaded=true;render()};
  subs.push(onSnapshot(collection(db,"anilar"),s=>{anilar=s.docs.map(clean).filter(Boolean);done(s);refreshPins();render()},fail));
  subs.push(onSnapshot(collection(db,"yorumlar"),s=>{yorumlar=s.docs.map(clean).filter(Boolean);done(s);render()},fail));
  subs.push(onSnapshot(collection(db,"kisiler"),s=>{const k={};for(const d of s.docs){const x=d.data();k[d.id]={ad:str(x.ad),foto:str(x.foto)}}kisiler=k;render()},()=>{}));
}
function unsubscribe(){subs.forEach(u=>u());subs=[];anilar=[];yorumlar=[];kisiler={};}

try{
  if(firebaseConfig?.apiKey&&!String(firebaseConfig.apiKey).startsWith("BURAYA")){
    const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
  }
}catch(e){db=null;auth=null}
if(!db){offline="Firebase ayarı henüz yapılmadı (firebase-config.js).";loaded=true;updateAcct();render()}
else onAuthStateChanged(auth,u=>{
  me=u;updateAcct();unsubscribe();
  if(u){
    setDoc(doc(db,"kisiler",u.uid),{ad:u.displayName||"",foto:u.photoURL||"",son:Date.now()},{merge:true}).catch(()=>{});
    loaded=false;subscribe();
  }else loaded=true;
  refreshPins();render();
});
}
